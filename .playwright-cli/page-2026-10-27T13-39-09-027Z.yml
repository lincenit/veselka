        - generic [ref=f7e62]:
          - paragraph [ref=f7e63]: Allrisk VESELKA vzniká jako moderní business & lifestyle park v Troubsku u Brna. Výrazná architektura, strategická dostupnost a promyšlená skladba nájemců vytváří prostředí pro služby a značky s vyšší přidanou hodnotou.
          - paragraph [ref=f7e64]: Propojujeme moderní business prostředí, odborné služby, wellbeing koncepty, design a showroomové značky do jednoho funkčního celku. Alternativa k anonymním retailovým zónám a generickým kancelářským komplexům, jaká nemá nejen v Brně obdoby.
