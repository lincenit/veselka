          - paragraph [ref=f5e65]: Allrisk VESELKA vzniká jako moderní business & lifestyle park v Troubsku u Brna. Výrazná architektura, strategická dostupnost a promyšlená skladba nájemců vytváří prostředí pro služby a značky s vyšší přidanou hodnotou.
